name: Design Pathology Tribunal

on:
  pull_request:
    paths:
      - "src/omniverse_design/**"
      - "schemas/**"
      - "registry/**"
      - "tests/**"
      - ".github/workflows/design-pathology-tribunal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tribunal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Design Pathology constitutional tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_design_pathology_pipeline.py tests/test_o18_o22_constitutional_chain.py
